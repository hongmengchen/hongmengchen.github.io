<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Outer ring (cosmos / origin) -->
  <circle cx="256" cy="256" r="220" stroke="url(#g1)" stroke-width="8" opacity="0.2" fill="none"/>
  <circle cx="256" cy="256" r="196" stroke="url(#g1)" stroke-width="3" opacity="0.15" fill="none"/>
  <!-- Inner geometric shape — interlocking diamond and circle -->
  <!-- Diamond (order) -->
  <polygon points="256,80 400,256 256,432 112,256" fill="url(#g1)" opacity="0.92"/>
  <!-- Inner circle (chaos/creation born from order) -->
  <circle cx="256" cy="256" r="92" fill="#f8fafc" opacity="0.95"/>
  <!-- Seed character 初 (beginning) — minimal strokes -->
  <text x="256" y="290" text-anchor="middle" font-family="'Noto Serif SC', 'Source Han Serif SC', serif" font-size="100" font-weight="700" fill="url(#g1)" opacity="0.9">初</text>
  <!-- Small diagonal dots suggesting energy / creation -->
  <circle cx="148" cy="148" r="6" fill="#0e7490" opacity="0.3"/>
  <circle cx="364" cy="148" r="6" fill="#3b82f6" opacity="0.3"/>
  <circle cx="364" cy="364" r="6" fill="#0e7490" opacity="0.3"/>
  <circle cx="148" cy="364" r="6" fill="#3b82f6" opacity="0.3"/>
</svg>
